<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="StarMemory 星念 Studio 本地小红书运营看板">
  <title>StarMemory｜星念运营看板</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%2314161d%22/%3E%3Cpath d=%22M32 10l4 18 18 4-18 4-4 18-4-18-18-4 18-4z%22 fill=%22%23f6d7a7%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="data/dashboard-data.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="StarMemory 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 44 44" fill="none">
            <circle cx="22" cy="22" r="16.5" stroke="currentColor" stroke-opacity=".55"/>
            <ellipse cx="22" cy="22" rx="19" ry="8" transform="rotate(-25 22 22)" stroke="currentColor" stroke-opacity=".32"/>
            <path d="M25.4 7.8l1.5 4.2 4.3 1.5-4.3 1.5-1.5 4.2-1.5-4.2-4.3-1.5 4.3-1.5 1.5-4.2z" fill="#F6D7A7"/>
          </svg>
        </span>
        <span class="brand-copy"><strong>StarMemory</strong><small>星念 Studio</small></span>
      </a>

      <div class="sidebar-label">工作台</div>
      <nav class="nav" aria-label="主导航">
        <button class="nav-item is-active" type="button" data-view="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
          <span>运营总览</span>
        </button>
        <button class="nav-item" type="button" data-view="notes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.75h9.2L19 7.6v12.65H6z"/><path d="M15 4v4h4M9 12h6M9 16h5"/></svg>
          <span>内容管理</span>
          <span class="nav-count" id="nav-note-count">20</span>
        </button>
        <button class="nav-item" type="button" data-view="calendar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17M8 13h2M14 13h2M8 16.5h2"/></svg>
          <span>内容日历</span>
        </button>
        <button class="nav-item" type="button" data-view="products">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.2L12 4l8 4.2v8L12 20l-8-3.8z"/><path d="M4.4 8.3L12 12l7.6-3.7M12 12v8"/></svg>
          <span>产品管理</span>
        </button>
        <button class="nav-item" type="button" data-view="analytics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V14M9.3 19.5V9M14.7 19.5V4.5M20 19.5v-8"/><path d="M3 19.5h18"/></svg>
          <span>数据分析</span>
        </button>
        <button class="nav-item" type="button" data-view="review">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h14v17H5z"/><path d="M8 8h8M8 11.5h5M8 16l1.7 1.7L13 14.4"/></svg>
          <span>运营复盘</span>
        </button>
      </nav>

      <div class="sidebar-rule"></div>
      <div class="sidebar-label">安全边界</div>
      <div class="safety-card">
        <span class="safety-pulse"></span>
        <div>
          <strong>仅本机运行</strong>
          <p>不自动发布<br>不自动互动<br>不保存账号凭证</p>
        </div>
      </div>

      <div class="sidebar-foot">
        <span>LOCAL OPS / V1.0</span>
        <span id="sidebar-updated">--</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">
          <p class="eyebrow" id="page-kicker">STAR MEMORY / OPERATIONS</p>
          <h1 id="page-title">运营总览</h1>
        </div>
        <div class="topbar-actions">
          <div class="connection" id="connection" title="本地服务连接状态">
            <span class="connection-dot"></span>
            <span id="connection-text">连接中</span>
          </div>
          <button class="button button-ghost" type="button" id="export-button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 10.5L12 15l4.5-4.5M4 20h16"/></svg>
            导出数据
          </button>
        </div>
      </header>

      <section class="view-root" id="view-root" aria-live="polite">
        <div class="loading-card">
          <span class="loading-orbit"></span>
          <div><strong>正在读取本地运营数据</strong><p>连接 dashboard/data/dashboard.json</p></div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <div>
          <p class="modal-kicker" id="modal-kicker">STARMEMORY</p>
          <h2 id="modal-title">详情</h2>
        </div>
        <button class="modal-close" type="button" id="modal-close" aria-label="关闭弹窗">×</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </section>
  </div>

  <noscript><div class="noscript">看板需要启用 JavaScript，并请通过本地 Node 服务访问。</div></noscript>
</body>
</html>
